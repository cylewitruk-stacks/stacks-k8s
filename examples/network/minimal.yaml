apiVersion: network.stacks.org/v1alpha1
kind: StacksNetwork
metadata:
  name: minimal
spec:
  defaults:
    bitcoinImage: bitcoin/bitcoin:25.2
    stacksNodeImage: stacks-core-network:local
    stacksSignerImage: stacks-core-network:local
    dependencyImage: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    imagePullPolicy: IfNotPresent
    workload:
      storage:
        enabled: true
        size: 1Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 2Gi
  bitcoinNodes:
    - name: bitcoin
      config:
        generated:
          profile: bitcoin-regtest/v1
  stacksNodes:
    - name: follower
      role: follower
      bitcoinNodeRef: bitcoin
      config:
        generated:
          profile: nakamoto-regtest-node/v1
