apiVersion: network.stacks.org/v1alpha1
kind: StacksNetwork
metadata:
  name: bitcoin-only
spec:
  defaults:
    bitcoinImage: bitcoin/bitcoin:25.2
    dependencyImage: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    imagePullPolicy: IfNotPresent
    workload:
      storage:
        enabled: true
        size: 1Gi
  bitcoinNodes:
    - name: miner
      role: miner
      config:
        generated:
          profile: bitcoin-regtest/v1
    - name: follower
      role: follower
      peerRefs: [miner]
      config:
        generated:
          profile: bitcoin-regtest/v1
