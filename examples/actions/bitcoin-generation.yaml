# Set networkUID and payout address from the selected running network before applying.
apiVersion: actions.stacks.org/v1alpha2
kind: BitcoinBlockGeneration
metadata:
  name: three-blocks
  labels:
    actions.stacks.org/correlation-id: ordinary-regtest-check
spec:
  networkUID: REPLACE-WITH-CURRENT-NETWORK-UID
  bitcoinNodeRef:
    name: btc-01
  count: 3
  cadence:
    mode: Fixed
    intervalSeconds: 2
  address: mipcBbFg9gMiCh81Kj8tqqdgoZub1ZJRfn
  timeout: 2m
