# Set networkUID and payout address from the selected running network before applying.
apiVersion: actions.stacks.org/v1alpha2
kind: BitcoinReorganization
metadata:
  name: replace-two-blocks
  labels:
    actions.stacks.org/correlation-id: local-fork-check
spec:
  networkUID: REPLACE-WITH-CURRENT-NETWORK-UID
  bitcoinNodeRef:
    name: btc-01
  depth: 2
  address: mipcBbFg9gMiCh81Kj8tqqdgoZub1ZJRfn
  boundaryPolicy:
    allowEpochBoundaryCrossing: true
    allowRewardCycleBoundaryCrossing: true
    allowPreparePhaseBoundaryCrossing: true
  timeout: 2m
