# Substitute UIDs read from the current v1alpha2 network and participant objects.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: actor-delay
  namespace: chaos-live
  labels:
    network.stacks.org/network: network
    network.stacks.org/network-uid: "${NETWORK_UID}"
    actions.stacks.org/correlation-id: network-delay-check
spec:
  action: delay
  mode: one
  direction: to
  duration: 30s
  selector:
    namespaces: [chaos-live]
    labelSelectors:
      network.stacks.org/network: network
      network.stacks.org/actor: bitcoin
      network.stacks.org/network-uid: "${NETWORK_UID}"
      network.stacks.org/participant-uid: "${SOURCE_PARTICIPANT_UID}"
      network.stacks.org/role: actor
  target:
    mode: one
    selector:
      namespaces: [chaos-live]
      labelSelectors:
        network.stacks.org/network: network
        network.stacks.org/actor: bitcoin-2
        network.stacks.org/network-uid: "${NETWORK_UID}"
        network.stacks.org/participant-uid: "${TARGET_PARTICIPANT_UID}"
        network.stacks.org/role: actor
  delay:
    latency: 500ms
    jitter: 0ms
    correlation: "0"
