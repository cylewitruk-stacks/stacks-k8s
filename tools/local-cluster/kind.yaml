kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: stacks-k8s
nodes:
  - role: control-plane
    # Observability chart dashboard.nodePort; Docker publishes only host loopback.
    extraPortMappings:
      - containerPort: 30400
        hostPort: 14000
        listenAddress: "127.0.0.1"
        protocol: TCP
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
