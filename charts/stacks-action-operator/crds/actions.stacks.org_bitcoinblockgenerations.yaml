---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: bitcoinblockgenerations.actions.stacks.org
spec:
  group: actions.stacks.org
  names:
    kind: BitcoinBlockGeneration
    listKind: BitcoinBlockGenerationList
    plural: bitcoinblockgenerations
    singular: bitcoinblockgeneration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.blocksGenerated
      name: Blocks
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BitcoinBlockGeneration requests a finite number of acknowledged
          regtest blocks.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is immutable from creation.
            properties:
              address:
                description: Address receives the regtest coinbase outputs.
                maxLength: 128
                minLength: 14
                type: string
              bitcoinNodeRef:
                description: BitcoinNodeRef names the exact compiled BitcoinNode,
                  not a Pod or Service.
                properties:
                  name:
                    description: Name is the exact Kubernetes resource name.
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              cadence:
                description: Cadence controls delays between receipts and subsequent
                  single-block requests.
                properties:
                  delaysSeconds:
                    description: DelaysSeconds contains count minus one ordered delays;
                      zero adds no intentional wait.
                    items:
                      format: int32
                      maximum: 60
                      minimum: 0
                      type: integer
                    maxItems: 99
                    type: array
                    x-kubernetes-list-type: atomic
                  intervalSeconds:
                    description: IntervalSeconds is the fixed receipt-relative delay.
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
                  maxSeconds:
                    description: MaxSeconds is the inclusive upper uniform bound.
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
                  minSeconds:
                    description: MinSeconds is the inclusive lower uniform bound.
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
                  mode:
                    description: Mode selects immediate, fixed, inclusive uniform,
                      or explicit inter-block delays.
                    enum:
                    - Immediate
                    - Fixed
                    - Uniform
                    - Explicit
                    maxLength: 9
                    type: string
                required:
                - mode
                type: object
                x-kubernetes-validations:
                - message: intervalSeconds is required only for Fixed
                  rule: has(self.intervalSeconds) == (self.mode == 'Fixed')
                - message: minSeconds and maxSeconds are required only for Uniform
                  rule: has(self.minSeconds) == (self.mode == 'Uniform') && has(self.maxSeconds)
                    == (self.mode == 'Uniform')
                - message: uniform bounds must be ordered
                  rule: self.mode != 'Uniform' || self.minSeconds <= self.maxSeconds
                - message: delaysSeconds is allowed only for Explicit
                  rule: '!has(self.delaysSeconds) || self.mode == ''Explicit'''
              count:
                description: Count bounds acknowledged single-block RPCs.
                format: int32
                maximum: 100
                minimum: 1
                type: integer
              networkRef:
                description: NetworkRef names the aggregate owning the execution ledger.
                properties:
                  name:
                    description: Name is the exact Kubernetes resource name.
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              timeout:
                description: Timeout includes all pending time from API-server creation.
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: timeout must be positive
                  rule: duration(self) > duration('0s')
                - message: timeout cannot exceed 10m
                  rule: duration(self) <= duration('10m')
            required:
            - address
            - bitcoinNodeRef
            - cadence
            - count
            - networkRef
            - timeout
            type: object
            x-kubernetes-validations:
            - message: action spec is immutable
              rule: self == oldSelf
            - message: explicit cadence requires count minus one delays
              rule: 'self.cadence.mode != ''Explicit'' || (has(self.cadence.delaysSeconds)
                ? size(self.cadence.delaysSeconds) : 0) == self.count - 1'
          status:
            description: Status contains bounded mechanism facts, never a protocol
              verdict.
            properties:
              admittedAt:
                description: AdmittedAt records the first durable reservation.
                format: date-time
                type: string
              admittedNetwork:
                description: AdmittedNetwork fixes the owning network identity.
                properties:
                  name:
                    description: Name identifies the admitted parent.
                    type: string
                  observedGeneration:
                    description: ObservedGeneration records the declaration generation
                      at admission.
                    format: int64
                    type: integer
                  uid:
                    description: UID fixes its incarnation.
                    type: string
                required:
                - name
                - observedGeneration
                - uid
                type: object
              admittedPolicy:
                description: AdmittedPolicy identifies the execution profile.
                properties:
                  digest:
                    description: Digest identifies approved RPC configuration.
                    type: string
                  generation:
                    description: Generation records its policy generation at admission.
                    format: int64
                    type: integer
                  uid:
                    description: UID identifies the execution ledger.
                    type: string
                required:
                - digest
                - generation
                - uid
                type: object
              admittedTarget:
                description: AdmittedTarget fixes the leaf and runtime identity.
                properties:
                  apiVersion:
                    description: APIVersion fixes the actor API.
                    type: string
                  configDigest:
                    description: ConfigDigest binds approved configuration bytes.
                    type: string
                  containerID:
                    description: ContainerID records the admitted process container.
                    type: string
                  kind:
                    description: Kind fixes the actor type.
                    type: string
                  name:
                    description: Name identifies the compiled leaf.
                    type: string
                  podUID:
                    description: PodUID identifies the admitted Pod.
                    type: string
                  revision:
                    description: Revision identifies the admitted workload rollout.
                    type: string
                  runtimeImageID:
                    description: RuntimeImageID identifies the executed image.
                    type: string
                  specDigest:
                    description: SpecDigest binds actor configuration intent.
                    type: string
                  statefulSetUID:
                    description: StatefulSetUID identifies the owning workload incarnation.
                    type: string
                  uid:
                    description: UID fixes the leaf incarnation.
                    type: string
                required:
                - apiVersion
                - configDigest
                - containerID
                - kind
                - name
                - podUID
                - revision
                - runtimeImageID
                - specDigest
                - statefulSetUID
                - uid
                type: object
              blocksGenerated:
                description: BlocksGenerated counts RPC receipts durably attributed
                  to this action.
                format: int32
                type: integer
              conditions:
                description: Conditions record stable lifecycle reasons.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 4
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: unsupported action condition
                  rule: self.all(c, c.type in ['Admitted', 'Progressing', 'EffectObserved',
                    'CleanupComplete'])
              correlationID:
                description: CorrelationID snapshots the admission correlation label.
                type: string
              expiresAt:
                description: ExpiresAt is creation time plus timeout.
                format: date-time
                type: string
              finishedAt:
                description: FinishedAt records the frozen terminal outcome time.
                format: date-time
                type: string
              lastBlockHash:
                description: LastBlockHash is the latest receipt, not canonical membership
                  evidence.
                type: string
              lastDispatchID:
                description: LastDispatchID acknowledges the ledger receipt copied
                  into status.
                type: string
              observedGeneration:
                description: ObservedGeneration identifies the immutable request evaluated.
                format: int64
                type: integer
              phase:
                description: Phase projects lifecycle conditions and durable mechanism
                  facts.
                enum:
                - Pending
                - Admitted
                - Active
                - Recovering
                - Completed
                - Recovered
                - Failed
                - Inconclusive
                type: string
              startedAt:
                description: StartedAt records the first potentially executable authorization.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
