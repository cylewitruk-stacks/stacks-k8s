{{- if not (or .Values.bitcoinGeneration.enabled .Values.bitcoinReorganization.enabled) }}
{{- fail "Enable at least one finite action controller" }}
{{- end }}
{{- range $path, $_ := .Files.Glob "crds/*.yaml" -}}
{{- $resource := (fromYaml ($.Files.Get $path)).metadata.name -}}
{{- $existing := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $resource -}}
{{- if $existing -}}
{{- range $version := $existing.spec.versions -}}
{{- if ne $version.name "v1alpha2" -}}
{{- fail (printf "Action CRD %s has incompatible version %s; explicitly remove old data and CRDs before replacement" $resource $version.name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}
rules:
  - apiGroups: [network.stacks.org]
    resources: [stacksnetworks, stacksnetworkparticipants]
    verbs: [get]
  - apiGroups: [bitcoin.stacks.org]
    resources: [bitcoinexecutions]
    verbs: [get]
  {{- if .Values.bitcoinGeneration.enabled }}
  - apiGroups: [actions.stacks.org]
    resources: [bitcoinblockgenerations]
    verbs: [get, list, watch, patch]
  - apiGroups: [actions.stacks.org]
    resources: [bitcoinblockgenerations/status]
    verbs: [patch]
  {{- end }}
  {{- if .Values.bitcoinReorganization.enabled }}
  - apiGroups: [actions.stacks.org]
    resources: [bitcoinreorganizations]
    verbs: [get, list, watch, patch]
  - apiGroups: [actions.stacks.org]
    resources: [bitcoinreorganizations/status]
    verbs: [patch]
  {{- end }}
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ .Release.Name }}-requests
spec:
  hard:
    count/bitcoinblockgenerations.actions.stacks.org: '64'
    count/bitcoinreorganizations.actions.stacks.org: '64'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --api-version=v1alpha2
            - {{ printf "--bitcoin-generation-enabled=%t" .Values.bitcoinGeneration.enabled | quote }}
            - {{ printf "--bitcoin-reorganization-enabled=%t" .Values.bitcoinReorganization.enabled | quote }}
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
