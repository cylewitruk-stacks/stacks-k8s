---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: networktelemetries.observation.stacks.org
spec:
  group: observation.stacks.org
  names:
    kind: NetworkTelemetry
    listKind: NetworkTelemetryList
    plural: networktelemetries
    shortNames:
    - ntel
    singular: networktelemetry
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.networkName
      name: Network
      type: string
    - jsonPath: .status.admitted
      name: Admitted
      type: boolean
    - jsonPath: .status.recording.backendReady
      name: Backend
      type: boolean
    name: v1alpha2
    schema:
      openAPIV3Schema:
        description: NetworkTelemetry declares passive continuous collection; deletion
          removes collectors, not backend tables.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetworkTelemetrySpec configures a same-namespace recording
              independent of network ownership.
            properties:
              networkName:
                description: NetworkName selects the source root; its UID must match
                  before collector creation.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              networkUID:
                description: NetworkUID prevents same-name replacement from inheriting
                  collection.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                type: string
              retention:
                description: Retention sets immutable table TTL.
                properties:
                  window:
                    description: |-
                      Window is the log/object TTL; native metrics use the backend profile's fixed 24h TTL.
                      TTL is not a hard byte quota or immediate physical erasure guarantee.
                    enum:
                    - 1h
                    - 6h
                    - 24h
                    type: string
                required:
                - window
                type: object
              sources:
                description: Sources controls future capture; changes can restart
                  collectors and create explicit gaps.
                properties:
                  logs:
                    description: Logs captures redacted workload stdout/stderr.
                    type: boolean
                  metrics:
                    description: Metrics scrapes named native metrics ports.
                    type: boolean
                  objects:
                    description: Objects captures allowlisted public Kubernetes observations.
                    type: boolean
                required:
                - logs
                - metrics
                - objects
                type: object
              storageSecretRef:
                description: StorageSecretRef names administrator-provisioned endpoint
                  and ingestion credentials.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
            required:
            - networkName
            - networkUID
            - retention
            - sources
            - storageSecretRef
            type: object
            x-kubernetes-validations:
            - message: network identity is immutable
              rule: self.networkName == oldSelf.networkName && self.networkUID ==
                oldSelf.networkUID
            - message: storage and retention require a new recording
              rule: self.retention == oldSelf.retention && self.storageSecretRef ==
                oldSelf.storageSecretRef
            - message: select at least one source
              rule: self.sources.objects || self.sources.logs || self.sources.metrics
          status:
            description: NetworkTelemetryStatus separates controller and recorder
              ownership.
            properties:
              admitted:
                description: Admitted records initial exact-root admission; collection
                  can outlive that root.
                type: boolean
              conditions:
                description: Conditions are written only by the workload controller.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 4
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              recording:
                description: Recording is written only by the recorder using server-side
                  apply.
                properties:
                  backendReady:
                    description: BackendReady reports the latest acknowledged record
                      export.
                    type: boolean
                  heartbeatAt:
                    description: HeartbeatAt timestamps the latest recorder status
                      publication.
                    format: date-time
                    type: string
                  observedGeneration:
                    description: ObservedGeneration binds these observations to the
                      recorder's admitted source settings.
                    format: int64
                    type: integer
                  podUID:
                    description: PodUID identifies this recorder session; restarts
                      do not imply continuous capture.
                    type: string
                  sources:
                    description: Sources contains current-process source observations.
                    items:
                      description: SourceStatus reports bounded point-in-time source
                        health; records live in the backend.
                      properties:
                        available:
                          description: Available reports a successful current list/watch
                            or export path.
                          type: boolean
                        gaps:
                          description: Gaps counts discontinuities observed by the
                            current recorder process.
                          format: int64
                          type: integer
                        name:
                          description: Name identifies the Kubernetes resource source.
                          type: string
                        observedAt:
                          description: ObservedAt is the latest source health check,
                            not a completeness watermark.
                          format: date-time
                          type: string
                        reason:
                          description: Reason identifies the current source health
                            boundary.
                          enum:
                          - Available
                          - Unavailable
                          - APINotInstalled
                          - AccessDenied
                          - ReadUnavailable
                          - WatchInterrupted
                          type: string
                      required:
                      - available
                      - gaps
                      - name
                      - observedAt
                      - reason
                      type: object
                    maxItems: 24
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                required:
                - backendReady
                - heartbeatAt
                - observedGeneration
                - podUID
                type: object
              tablePrefix:
                description: TablePrefix locates this recording's independently retained
                  tables.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
