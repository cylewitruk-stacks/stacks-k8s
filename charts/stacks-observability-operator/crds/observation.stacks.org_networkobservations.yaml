---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: networkobservations.observation.stacks.org
spec:
  group: observation.stacks.org
  names:
    kind: NetworkObservation
    listKind: NetworkObservationList
    plural: networkobservations
    shortNames:
    - nobs
    singular: networkobservation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.networkRef.name
      name: Network
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NetworkObservation requests one compact trusted identity observation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetworkObservationSpec requests one identity-bound observation.
            properties:
              expectedInventoryDigest:
                description: ExpectedInventoryDigest binds only a legacy v1alpha1
                  network inventory.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              expectedSnapshotDigest:
                description: ExpectedSnapshotDigest binds the independently observed
                  v1alpha2 actor snapshot.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              networkRef:
                description: NetworkRef selects a StacksNetwork in this namespace.
                properties:
                  name:
                    description: Name is the referenced resource name.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              pendingTimeoutSeconds:
                default: 300
                description: PendingTimeoutSeconds bounds how long the observation
                  waits for a ready topology.
                format: int32
                maximum: 86400
                minimum: 10
                type: integer
              timeoutSeconds:
                default: 10
                description: TimeoutSeconds bounds the complete direct-read observation.
                format: int32
                maximum: 30
                minimum: 1
                type: integer
            required:
            - networkRef
            type: object
          status:
            description: NetworkObservationStatus records one terminal or pending
              observation.
            properties:
              actors:
                description: Actors contains directly verified identities when Ready.
                items:
                  description: ObservedActorIdentity contains orchestrator-observed
                    runtime facts.
                  properties:
                    configDigest:
                      description: ConfigDigest binds the admitted configuration declaration
                        or bytes.
                      type: string
                    configurationEvidence:
                      description: ConfigurationEvidence attributes Secret identity
                        and content to public controller reports.
                      enum:
                      - controller-reported
                      type: string
                    configurationFingerprint:
                      description: ConfigurationFingerprint is the controller-reported
                        private configuration content digest.
                      type: string
                    configurationName:
                      description: ConfigurationName is the mounted Secret name published
                        by the participant.
                      type: string
                    configurationReportUID:
                      description: ConfigurationReportUID pins the corroborating public
                        resolver ConfigMap.
                      type: string
                    configurationUID:
                      description: ConfigurationUID is the controller-reported Secret
                        UID; Secret metadata is not read.
                      type: string
                    containerID:
                      description: ContainerID pins the directly observed v1alpha2
                        actor process.
                      type: string
                    controllerRevision:
                      description: ControllerRevision is the converged StatefulSet
                        revision.
                      type: string
                    evidenceClass:
                      description: EvidenceClass distinguishes Kubernetes-observed
                        facts from actor reports.
                      enum:
                      - orchestrator-observed
                      type: string
                    kind:
                      description: Kind is the admitted leaf resource kind.
                      type: string
                    name:
                      description: Name is the logical actor name.
                      type: string
                    podName:
                      description: PodName is the admitted actor Pod name.
                      type: string
                    podUID:
                      description: PodUID prevents same-name Pod replacement from
                        being hidden.
                      type: string
                    requestedImage:
                      description: RequestedImage is the declared image reference.
                      type: string
                    resourceName:
                      description: ResourceName is the admitted leaf resource name.
                      type: string
                    resourceUID:
                      description: ResourceUID pins the generated v1alpha2 participant.
                      type: string
                    role:
                      description: Role is the Stacks node or signer role; Bitcoin
                        nodes have none.
                      type: string
                    runtimeImageID:
                      description: RuntimeImageID is the immutable image digest reported
                        by Kubernetes.
                      type: string
                    serviceName:
                      description: ServiceName is the actor's stable Service identity.
                      type: string
                    services:
                      description: Services contains all directly checked v1alpha2
                        endpoint identities.
                      items:
                        description: ObservedServiceIdentity records a directly verified
                          participant endpoint.
                        properties:
                          name:
                            description: Name is the same-namespace Service name.
                            type: string
                          port:
                            description: Port is the verified TCP port.
                            format: int32
                            type: integer
                          protocol:
                            description: Protocol identifies the native endpoint.
                            type: string
                          uid:
                            description: UID pins the Service object.
                            type: string
                        required:
                        - name
                        - port
                        - protocol
                        - uid
                        type: object
                      maxItems: 8
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                    specDigest:
                      description: SpecDigest binds the legacy leaf spec or complete
                        v1alpha2 admitted configuration.
                      type: string
                    statefulSetName:
                      description: StatefulSetName is the actor workload name.
                      type: string
                    statefulSetUID:
                      description: StatefulSetUID prevents same-name workload replacement
                        from being hidden.
                      type: string
                  required:
                  - configDigest
                  - controllerRevision
                  - evidenceClass
                  - kind
                  - name
                  - podName
                  - podUID
                  - requestedImage
                  - resourceName
                  - runtimeImageID
                  - serviceName
                  - specDigest
                  - statefulSetName
                  - statefulSetUID
                  type: object
                maxItems: 1000
                type: array
                x-kubernetes-list-map-keys:
                - kind
                - name
                x-kubernetes-list-type: map
              binding:
                description: Binding identifies the stable topology when Ready.
                properties:
                  inventoryDigest:
                    description: InventoryDigest binds only the legacy admitted actor
                      set.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  name:
                    description: Name is the topology resource name.
                    type: string
                  networkAPIVersion:
                    description: NetworkAPIVersion identifies the selected network
                      API, without version fallback.
                    enum:
                    - network.stacks.org/v1alpha1
                    - network.stacks.org/v1alpha2
                    type: string
                  observedGeneration:
                    description: ObservedGeneration is the topology generation read
                      for this snapshot.
                    format: int64
                    type: integer
                  snapshotDigest:
                    description: SnapshotDigest identifies the observation-owned v1alpha2
                      actor snapshot.
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  uid:
                    description: UID prevents same-name topology replacement from
                      being hidden.
                    type: string
                required:
                - name
                - observedGeneration
                - uid
                type: object
              completedAt:
                description: CompletedAt records terminal completion.
                format: date-time
                type: string
              conditions:
                description: Conditions provide Kubernetes-standard diagnostics.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 4
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the observation generation evaluated.
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Ready, or Inconclusive.
                enum:
                - Pending
                - Ready
                - Inconclusive
                type: string
              startedAt:
                description: StartedAt records when this generation first attempted
                  observation.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
