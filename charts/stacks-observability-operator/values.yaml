replicaCount: 1

image:
  repository: ghcr.io/cylewitruk-stacks/stacks-observability-operator
  tag: "0.1.0"
  pullPolicy: IfNotPresent

controller:
  maxConcurrentReconciles: 2
  leaderElection: true
  logLevel: info

serviceAccount:
  create: true
  name: ""

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Explicit namespace enrollment; an empty list observes only the installation namespace.
watchNamespaces: []
collector:
  image: otel/opentelemetry-collector-contrib:0.160.0

# Optional bundled backend. Credentials are administrator-provisioned, never generated in values.
greptime:
  enabled: false
  image:
    tag: v1.2.0
  persistence:
    enabled: true
    enableStatefulSetAutoDeletePVC: true
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 3Gi
  logging:
    onlyLogToStdout: true
  auth:
    enabled: true
    existingSecretName: greptime-auth
    fileName: passwd
  configToml: |
    mode = 'standalone'
    max_in_flight_write_bytes = '32MB'
    max_concurrent_queries = 4
    [query]
    parallelism = 2
    memory_pool_size = '1GB'
    [[region_engine]]
    [region_engine.mito]
    num_workers = 2
    global_write_buffer_size = '128MB'
    global_write_buffer_reject_size = '256MB'
    sst_meta_cache_size = '32MB'
    vector_cache_size = '32MB'
    page_cache_size = '32MB'
    selector_result_cache_size = '16MB'
    range_result_cache_size = '16MB'
    prefilter_result_cache_size = '16MB'
    manifest_cache_size = '32MB'
    scan_memory_limit = '1GB'
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  service:
    type: ClusterIP

backendInitialization:
  enabled: true

# Exposes the bundled backend's HTTP API, including /dashboard (Perses).
# kind must publish this NodePort to the host; see values-local.yaml.
dashboard:
  enabled: false
  nodePort: 30400
