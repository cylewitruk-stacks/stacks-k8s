{{- if and (gt (int .Values.replicaCount) 1) (not .Values.controller.leaderElection) }}
{{- fail "controller.leaderElection must be true when replicaCount is greater than one" }}
{{- end }}
{{- if and (not .Values.serviceAccount.create) (empty .Values.serviceAccount.name) }}
{{- fail "serviceAccount.name is required when serviceAccount.create is false" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stacks-observability-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "stacks-observability-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ ternary "RollingUpdate" "Recreate" .Values.controller.leaderElection }}
  selector:
    matchLabels:
      {{- include "stacks-observability-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stacks-observability-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "stacks-observability-operator.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --watch-namespace={{ include "stacks-observability-operator.watchNamespaces" . }}
            - --leader-election-namespace={{ .Release.Namespace }}
            - --worker-image={{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
            - --collector-image={{ .Values.collector.image }}
            - --max-concurrent-reconciles={{ .Values.controller.maxConcurrentReconciles }}
            - --leader-elect={{ .Values.controller.leaderElection }}
            - --zap-log-level={{ .Values.controller.logLevel }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
