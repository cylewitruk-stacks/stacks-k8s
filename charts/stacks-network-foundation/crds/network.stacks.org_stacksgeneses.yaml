                                    pattern: ^ST[0-9A-HJKMNP-TV-Z]{26,39}$
                                    type: string
                                  publicKey:
                                    description: PublicKey is a compressed secp256k1
                                      public key.
                                    pattern: ^(02|03)[0-9a-fA-F]{64}$
                                    type: string
                                required:
                                - address
                                - publicKey
                                type: object
                            required:
                            - binding
                            - identity
                            type: object
                          maxItems: 1000
                          type: array
                        amountMicroSTX:
