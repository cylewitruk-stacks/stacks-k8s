                                  maxLength: 253
                                  minLength: 1
                                  pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                                  type: string
                              required:
                              - name
                              type: object
                          required:
                          - matureOutputsPerMiner
                          - minimumHeight
                          - targetNodeRef
                          type: object
                        bitcoinPayoutWallet:
                          description: BitcoinPayoutWallet pins the public payout
                            identity across production replacement.
                          properties:
                            fingerprint:
                              description: Fingerprint identifies public content when
                                relevant.
                              type: string
                            kind:
                              description: Kind identifies the API kind or participant
                                kind.
                              type: string
                            name:
                              description: Name is the public resource name.
                              type: string
                            uid:
                              description: UID prevents same-name replacement from
                                inheriting authority.
                              type: string
                          required:
                          - kind
                          - name
                          - uid
                          type: object
                        dependencies:
                          description: Dependencies pins public credential identities.
                          items:
                            description: Binding identifies an exact resolved public
                              dependency.
                            properties:
                              fingerprint:
                                description: Fingerprint identifies public content
                                  when relevant.
                                type: string
                              kind:
                                description: Kind identifies the API kind or participant
                                  kind.
                                type: string
                              name:
                                description: Name is the public resource name.
                                type: string
                              uid:
                                description: UID prevents same-name replacement from
                                  inheriting authority.
                                type: string
                            required:
                            - kind
                            - name
                            - uid
                            type: object
                          maxItems: 1000
                          type: array
                        lockCycles:
                          description: LockCycles preserves required coverage.
                          format: int32
                          type: integer
                        participant:
                          description: Participant is the exact initial instance identity.
                          properties:
                            fingerprint:
                              description: Fingerprint identifies public content when
                                relevant.
                              type: string
                            kind:
                              description: Kind identifies the API kind or participant
                                kind.
                              type: string
                            name:
                              description: Name is the public resource name.
                              type: string
                            uid:
                              description: UID prevents same-name replacement from
                                inheriting authority.
                              type: string
                          required:
                          - kind
                          - name
                          - uid
                          type: object
                        policyDigest:
                          description: PolicyDigest identifies its initially admitted
                            configuration.
                          type: string
                        registryInitialization:
                          description: RegistryInitialization preserves exact initial
                            bridge state.
                          properties:
                            aggregateKeyAccountRef:
                              description: AggregateKeyAccountRef supplies the explicit
                                aggregate key.
                              properties:
                                name:
                                  description: Name is the referenced name; the containing
                                    field determines its kind.
                                  maxLength: 253
                                  minLength: 1
                                  pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                                  type: string
                              required:
                              - name
                              type: object
                            mode:
                              description: Mode is the supported initialization authority.
                              enum:
                              - ExplicitTestRegistry
                              type: string
                            signerAccountRefs:
                              description: SignerAccountRefs supplies public bridge
                                identities.
                              items:
                                description: NameRef selects a resource or participant
                                  in the same namespace.
                                properties:
                                  name:
                                    description: Name is the referenced name; the
                                      containing field determines its kind.
                                    maxLength: 253
                                    minLength: 1
                                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                                    type: string
                                required:
                                - name
                                type: object
                              maxItems: 100
                              minItems: 1
                              type: array
                              x-kubernetes-list-map-keys:
                              - name
                              x-kubernetes-list-type: map
                            threshold:
                              description: Threshold bounds registry authorization.
                              format: int32
                              maximum: 100
                              minimum: 1
                              type: integer
