                      properties:
                        bitcoinCeiling:
                          description: BitcoinCeiling bounds new generation.
                          format: int64
                          type: integer
                        name:
                          description: Name identifies one convergence gate.
                          type: string
                        targetCycle:
                          description: TargetCycle identifies required enrollment
