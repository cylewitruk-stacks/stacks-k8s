                        type: string
                      deployer:
                        description: Deployer is the resolved deployment principal.
                        type: string
                      sourceHashes:
                        additionalProperties:
                          type: string
                        description: SourceHashes identifies contract sources.
                        maxProperties: 32
                        type: object
                    required:
                    - bundle
                    - deployer
                    - sourceHashes
                    type: object
                  epochs:
                    description: Epochs contains ordered activation boundaries.
