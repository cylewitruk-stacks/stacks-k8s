                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              credentialsRef:
                description: CredentialsRef identifies generated or imported private
                  material.
                properties:
                  key:
                    description: Key selects one entry.
                    maxLength: 253
                    minLength: 1
                    type: string
                  name:
                    description: Name selects a same-namespace Secret.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              credentialsUID:
                description: CredentialsUID pins imported or generated key material
                  after resolution.
                type: string
              dependencies:
                description: Dependencies pins public source identities.
                items:
                  description: Binding identifies an exact resolved public dependency.
                  properties:
                    fingerprint:
                      description: Fingerprint identifies public content when relevant.
                      type: string
                    kind:
                      description: Kind identifies the API kind or participant kind.
                      type: string
                    name:
                      description: Name is the public resource name.
                      type: string
                    uid:
                      description: UID prevents same-name replacement from inheriting
                        authority.
                      type: string
                  required:
                  - kind
                  - name
                  - uid
                  type: object
                maxItems: 8
                type: array
              descriptor:
                description: Descriptor is the supported public wallet descriptor.
                type: string
              digest:
                description: Digest identifies resolved public inputs.
                type: string
              identity:
                description: Identity contains public account information.
                properties:
                  address:
                    description: Address is a testnet Stacks address.
                    maxLength: 64
                    pattern: ^ST[0-9A-HJKMNP-TV-Z]{26,39}$
                    type: string
                  publicKey:
                    description: PublicKey is a compressed secp256k1 public key.
                    pattern: ^(02|03)[0-9a-fA-F]{64}$
                    type: string
                required:
                - address
                - publicKey
                type: object
              observedGeneration:
                description: ObservedGeneration identifies the evaluated spec.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: genesis is immutable
          rule: self.spec == oldSelf.spec
    served: true
    storage: true
    subresources:
      status: {}
