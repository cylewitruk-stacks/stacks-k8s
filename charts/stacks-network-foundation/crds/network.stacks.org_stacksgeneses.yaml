              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec stores captured immutable inputs.
            properties:
              bootstrap:
                description: Bootstrap retains requirements outside the chain digest.
                properties:
                  gates:
                    description: Gates defines the profile's fixed initialization
                      boundaries.
                    items:
                      description: Gate describes the fixed profile's initial observation
