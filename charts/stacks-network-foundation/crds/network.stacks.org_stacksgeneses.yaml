                          enum:
                          - "1.0"
                          - "2.0"
                          - "2.05"
                          - "2.1"
                          - "2.2"
                          - "2.3"
                          - "2.4"
                          - "2.5"
                          - "3.0"
                          - "3.1"
                          - "3.2"
                          - "3.3"
                          - "3.4"
                          - "4.0"
                          type: string
                        startHeight:
                          description: StartHeight is the activation burn height.
                          format: int64
                          maximum: 4294967295
                          minimum: 0
                          type: integer
                      required:
                      - name
                      - startHeight
                      type: object
                    maxItems: 14
                    type: array
                  pox:
                    description: PoX contains resolved cycle lengths.
                    properties:
                      prepareLength:
                        description: PrepareLength counts preparation blocks.
                        format: int32
                        maximum: 99999
                        minimum: 1
                        type: integer
                      rewardCycleLength:
                        description: RewardCycleLength counts Bitcoin blocks per cycle.
                        format: int32
                        maximum: 100000
                        minimum: 2
                        type: integer
                    required:
                    - prepareLength
                    - rewardCycleLength
                    type: object
                    x-kubernetes-validations:
                    - message: prepare must be shorter than reward cycle
                      rule: self.prepareLength < self.rewardCycleLength
                  profile:
                    description: Profile identifies the pinned profile revision.
                    type: string
                required:
                - allocations
                - contracts
                - epochs
                - pox
                - profile
                type: object
              source:
                description: Source records captured network provenance.
                properties:
                  dependencies:
                    description: Dependencies pins genesis-source identities.
                    items:
                      description: Binding identifies an exact resolved public dependency.
                      properties:
                        fingerprint:
                          description: Fingerprint identifies public content when
                            relevant.
                          type: string
                        kind:
                          description: Kind identifies the API kind or participant
                            kind.
                          type: string
                        name:
                          description: Name is the public resource name.
                          type: string
                        uid:
