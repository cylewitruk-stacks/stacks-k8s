{{- range $path, $_ := .Files.Glob "crds/*.yaml" -}}
{{- $resource := (fromYaml ($.Files.Get $path)).metadata.name -}}
{{- $existing := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $resource -}}
{{- if $existing -}}
{{- range $version := $existing.spec.versions -}}
{{- if ne $version.name "v1alpha2" -}}
{{- fail (printf "Foundation CRD %s has incompatible version %s; use a separate cluster or explicitly remove the old CRDs and data first" $resource $version.name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-foundation
rules:
  - apiGroups: [network.stacks.org]
    resources: [stacksnetworks]
    verbs: [get, list, watch, patch]
  - apiGroups: [network.stacks.org]
    resources: [stacksnetworkparticipants]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [network.stacks.org]
    resources: [stacksgeneses]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [network.stacks.org]
    resources: [stacksepochschedules]
    verbs: [get, list, watch]
  - apiGroups: [network.stacks.org]
    resources: [stacksnetworks/status, stacksnetworkparticipants/status, stacksepochschedules/status]
    verbs: [get, patch]
  - apiGroups: [bitcoin.stacks.org]
    resources: [bitcoinnodes, bitcoinwallets, bitcoinblockschedules, bitcoinblockproductions]
    verbs: [get, list, watch]
  - apiGroups: [bitcoin.stacks.org]
    resources: [bitcoinnodes/status, bitcoinwallets/status, bitcoinblockschedules/status, bitcoinblockproductions/status]
    verbs: [get, patch]
  - apiGroups: [stacks.stacks.org]
    resources: [stacksaccounts, stacksnodes, stackssigners, stacksstackers, stacksfaucets, stackscontractsets, stackstransactionproductions]
    verbs: [get, list, watch]
  - apiGroups: [stacks.stacks.org]
    resources: [stacksaccounts]
    verbs: [create]
  - apiGroups: [stacks.stacks.org]
    resources: [stacksaccounts/status, stacksnodes/status, stackssigners/status, stacksstackers/status, stacksfaucets/status, stackscontractsets/status, stackstransactionproductions/status]
    verbs: [get, patch]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch, create, patch]
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, watch, create]
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [get, list, watch, create, patch]
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: ['']
    resources: [services]
    verbs: [get, list, watch, create, patch]
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [get, patch]
  - apiGroups: [bitcoin.stacks.org]
    resources: [bitcoinexecutions]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [bitcoin.stacks.org]
    resources: [bitcoininitializations]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [bitcoin.stacks.org]
    resources: [bitcoinexecutions/status, bitcoininitializations/status]
    verbs: [update]
  - apiGroups: [stacks.stacks.org]
    resources: [stacksfaucetrequests]
    verbs: [get, list, watch]
  - apiGroups: [stacks.stacks.org]
    resources: [stacksfaucetrequests/status]
    verbs: [patch]
  - apiGroups: [bitcoin.stacks.org]
    resources: [bitcoinblockscheduleoverrides]
    verbs: [get, list, watch, patch]
  - apiGroups: [bitcoin.stacks.org]
    resources: [bitcoinblockscheduleoverrides/status]
    verbs: [patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
  {{- if .Values.bitcoinActions.generationEnabled }}
  - apiGroups: [actions.stacks.org]
    resources: [bitcoinblockgenerations]
    verbs: [get, list]
  {{- end }}
  {{- if .Values.bitcoinActions.reorganizationEnabled }}
  - apiGroups: [actions.stacks.org]
    resources: [bitcoinreorganizations]
    verbs: [get, list]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-foundation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-foundation
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=controller
            {{- if .Values.bitcoinActions.generationEnabled }}
            - --bitcoin-generation-enabled=true
            {{- end }}
            {{- if .Values.bitcoinActions.reorganizationEnabled }}
            - --bitcoin-reorganization-enabled=true
            {{- end }}
            - {{ printf "--resolver-image=%s:%s" .Values.image.repository .Values.image.tag | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
