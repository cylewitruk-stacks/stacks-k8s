image:
  repository: stacks-network-operator
  tag: dev
  pullPolicy: IfNotPresent
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

bitcoinActions:
  generationEnabled: false
  reorganizationEnabled: false

# Independent pin: controller/resolver image changes must not implicitly roll Bitcoin actors.
bitcoinObserverImage: stacks-network-operator:0.2.0
