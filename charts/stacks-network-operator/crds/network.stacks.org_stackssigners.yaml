                      properties:
                        effect:
                          enum:
                          - NoSchedule
                          - PreferNoSchedule
                          - NoExecute
                          type: string
                        key:
                          type: string
                        operator:
                          description: A toleration operator is the set of operators
                            that can be used in a toleration.
                          enum:
                          - Exists
                          - Equal
                          type: string
                        tolerationSeconds:
                          format: int64
                          type: integer
                        value:
                          type: string
                      type: object
                    type: array
                type: object
