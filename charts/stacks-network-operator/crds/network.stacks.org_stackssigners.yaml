                          type: string
                        maxItems: 64
                        type: array
                        x-kubernetes-list-type: set
                      eventDispatcher:
                        enum:
                        - queued
                        - blocking
                        type: string
                      profile:
                        enum:
                        - bitcoin-regtest/v1
                        - nakamoto-regtest-node/v1
                        type: string
                      seed:
                        description: Seed pins a generated Stacks node identity. Empty
