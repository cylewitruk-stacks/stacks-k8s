---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: stackssigners.network.stacks.org
spec:
  group: network.stacks.org
  names:
    kind: StacksSigner
    listKind: StacksSignerList
    plural: stackssigners
    singular: stackssigner
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.actorName
      name: Actor
      type: string
    - jsonPath: .spec.nodeRef.name
      name: Node
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: StacksSigner is a compiled Stacks signer workload.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: StacksSignerSpec contains the fully resolved signer declaration.
            properties:
              actorName:
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                type: string
              config:
                description: ConfigSource selects generated, inline, ConfigMap, or
                  Secret configuration.
                properties:
                  configMapRef:
                    description: ConfigObjectRef identifies one complete configuration
                      file.
                    properties:
                      expectedDigest:
                        description: ExpectedDigest triggers a restart and verifies
