                      minLength: 1
                      pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                      type: string
                  required:
                  - name
                  type: object
                type: array
              index:
                format: int32
                minimum: 0
                type: integer
              networkRef:
                description: LocalObjectReference identifies a same-namespace topology
                  object.
                properties:
                  name:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              nodeRef:
                description: LocalObjectReference identifies a same-namespace topology
                  object.
                properties:
                  name:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
              publicKey:
                type: string
              serviceMap:
                additionalProperties:
                  type: string
                description: ServiceMap resolves only the actor's declared and direct
