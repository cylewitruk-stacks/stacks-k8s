                    type: string
                  controllerRevision:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  podName:
                    type: string
                  podUID:
                    type: string
                  requestedImage:
                    type: string
                  resourceName:
                    type: string
                  role:
                    description: Role is the Stacks node or signer role; Bitcoin nodes
