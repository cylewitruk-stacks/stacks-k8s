                        type: string
                      storageClassName:
                        type: string
                    type: object
                  terminationGracePeriodSeconds:
                    format: int64
                    minimum: 0
                    type: integer
                  tolerations:
                    items:
                      description: TolerationSpec is the bounded subset of Pod toleration
