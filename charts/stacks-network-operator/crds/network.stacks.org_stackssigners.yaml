                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                        type: object
                      requests:
                        description: ResourceValues contains Kubernetes quantity strings
                          for CPU and memory.
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                        type: object
                    type: object
                  storage:
                    description: StorageSpec configures an actor data volume.
                    properties:
