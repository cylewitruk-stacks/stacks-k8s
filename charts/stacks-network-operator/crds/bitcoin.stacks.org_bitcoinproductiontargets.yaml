---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: bitcoinproductiontargets.bitcoin.stacks.org
spec:
  group: bitcoin.stacks.org
  names:
    kind: BitcoinProductionTarget
    listKind: BitcoinProductionTargetList
    plural: bitcoinproductiontargets
    singular: bitcoinproductiontarget
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.blocksProduced
      name: Blocks
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BitcoinProductionTarget retains one policy-owned execution and
          exclusion ledger.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is compiled by the owning production policy.
            properties:
              networkName:
                description: NetworkName identifies the owning StacksNetwork.
                maxLength: 63
                minLength: 1
                type: string
              networkUID:
                description: NetworkUID prevents admission after parent replacement.
                maxLength: 64
                minLength: 1
                type: string
              policy:
                description: Policy supplies the current target, cadence, destination
                  and pause state.
                properties:
                  address:
                    description: Address receives generated regtest coinbase outputs.
                    maxLength: 128
                    minLength: 14
                    type: string
                  intervalSeconds:
                    description: IntervalSeconds mirrors the root policy cadence;
                      this target has no independent timer.
                    format: int32
                    maximum: 86400
                    minimum: 1
                    type: integer
                  paused:
                    description: Paused stops new dispatches without cancelling one
                      already armed.
                    type: boolean
                  target:
                    description: Target names a Bitcoin actor in the owning network.
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                required:
                - address
                - intervalSeconds
                - target
                type: object
              productionUID:
                description: ProductionUID pins the owning aggregate production policy.
                maxLength: 64
                minLength: 1
                type: string
            required:
            - networkName
            - networkUID
            - policy
            - productionUID
            type: object
            x-kubernetes-validations:
            - message: network, production owner and target are immutable
              rule: self.networkName == oldSelf.networkName && self.networkUID ==
                oldSelf.networkUID && self.productionUID == oldSelf.productionUID
                && self.policy.target == oldSelf.policy.target
          status:
            description: Status retains dispatch evidence for this target's production
              lifetime.
            properties:
              action:
                description: Action reserves this ledger for one bounded action through
                  durable accounting.
                properties:
                  admittedAt:
                    description: AdmittedAt records first reservation time.
                    format: date-time
                    type: string
                  blocksGenerated:
                    description: BlocksGenerated counts acknowledged receipts, separately
                      from baseline blocks.
                    format: int32
                    type: integer
                  correlationID:
                    description: CorrelationID snapshots the external correlation
                      label.
                    type: string
                  effectUncertain:
                    description: EffectUncertain marks lost receipt/process knowledge;
                      time cannot clear it.
                    type: boolean
                  expiresAt:
                    description: ExpiresAt is the action's creation-relative deadline.
                    format: date-time
                    type: string
                  generation:
                    description: Generation records admission metadata; deletion may
                      advance it without changing the immutable spec.
                    format: int64
                    type: integer
                  lastBlockHash:
                    description: LastBlockHash retains the latest action receipt.
                    type: string
                  lastCompletedAt:
                    description: LastCompletedAt anchors the action's next dispatch.
                    format: date-time
                    type: string
                  lastDispatchID:
                    description: LastDispatchID identifies the receipt to acknowledge
                      in action status.
                    type: string
                  name:
                    description: Name identifies the selected action object.
                    type: string
                  network:
                    description: Network captures admission against the current parent
                      catalog.
                    properties:
                      name:
                        description: Name identifies the admitted parent.
                        type: string
                      observedGeneration:
                        description: ObservedGeneration records the declaration generation
                          at admission.
                        format: int64
                        type: integer
                      uid:
                        description: UID fixes its incarnation.
                        type: string
                    required:
                    - name
                    - observedGeneration
                    - uid
                    type: object
                  policy:
                    description: Policy records the ledger and static configuration
                      profile.
                    properties:
                      digest:
                        description: Digest identifies approved RPC configuration.
                        type: string
                      generation:
                        description: Generation records its policy generation at admission.
                        format: int64
                        type: integer
                      uid:
                        description: UID identifies the execution ledger.
                        type: string
                    required:
                    - digest
                    - generation
                    - uid
                    type: object
                  spec:
                    description: Spec snapshots the admitted typed operation.
                    properties:
                      address:
                        description: Address receives the regtest coinbase outputs.
                        maxLength: 128
                        minLength: 14
                        type: string
                      bitcoinNodeRef:
                        description: BitcoinNodeRef names the exact compiled BitcoinNode,
                          not a Pod or Service.
                        properties:
                          name:
                            description: Name is the exact Kubernetes resource name.
                            maxLength: 63
                            pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      count:
                        description: Count bounds acknowledged single-block RPCs.
                        format: int32
                        maximum: 100
                        minimum: 1
                        type: integer
                      intervalSeconds:
                        description: IntervalSeconds is the minimum delay after each
                          receipt; no catch-up occurs.
                        format: int32
                        maximum: 60
                        minimum: 1
                        type: integer
                      networkRef:
                        description: NetworkRef names the aggregate owning the execution
                          ledger.
                        properties:
                          name:
                            description: Name is the exact Kubernetes resource name.
                            maxLength: 63
                            pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      timeout:
                        description: Timeout includes all pending time from API-server
                          creation.
                        maxLength: 32
                        type: string
                        x-kubernetes-validations:
                        - message: timeout must be positive
                          rule: duration(self) > duration('0s')
                        - message: timeout cannot exceed 10m
                          rule: duration(self) <= duration('10m')
                    required:
                    - address
                    - bitcoinNodeRef
                    - count
                    - intervalSeconds
                    - networkRef
                    - timeout
                    type: object
                    x-kubernetes-validations:
                    - message: action spec is immutable
                      rule: self == oldSelf
                  startedAt:
                    description: StartedAt records the first durable authorization.
                    format: date-time
                    type: string
                  stopReason:
                    description: StopReason freezes a definite admission/identity
                      failure before another dispatch.
                    type: string
                  target:
                    description: Target freezes the actor/runtime identity for all
                      dispatches.
                    properties:
                      apiVersion:
                        description: APIVersion fixes the actor API.
                        type: string
                      configDigest:
                        description: ConfigDigest binds approved configuration bytes.
                        type: string
                      containerID:
                        description: ContainerID records the admitted process container.
                        type: string
                      kind:
                        description: Kind fixes the actor type.
                        type: string
                      name:
                        description: Name identifies the compiled leaf.
                        type: string
                      podUID:
                        description: PodUID identifies the admitted Pod.
                        type: string
                      revision:
                        description: Revision identifies the admitted workload rollout.
                        type: string
                      runtimeImageID:
                        description: RuntimeImageID identifies the executed image.
                        type: string
                      specDigest:
                        description: SpecDigest binds actor configuration intent.
                        type: string
                      statefulSetUID:
                        description: StatefulSetUID identifies the owning workload
                          incarnation.
                        type: string
                      uid:
                        description: UID fixes the leaf incarnation.
                        type: string
                    required:
                    - apiVersion
                    - configDigest
                    - containerID
                    - kind
                    - name
                    - podUID
                    - revision
                    - runtimeImageID
                    - specDigest
                    - statefulSetUID
                    - uid
                    type: object
                  uid:
                    description: UID prevents action replacement from inheriting authority.
                    type: string
                required:
                - admittedAt
                - expiresAt
                - generation
                - name
                - network
                - policy
                - spec
                - target
                - uid
                type: object
              blocksProduced:
                description: BlocksProduced counts blocks acknowledged and atomically
                  accounted by this ledger.
                format: int64
                type: integer
              containerID:
                description: ContainerID records the admitted Bitcoin process container.
                type: string
              dispatchID:
                description: DispatchID uniquely identifies the last authorization,
                  including its process-start nonce.
                type: string
              dispatchState:
                description: DispatchState is empty before first use, Idle after a
                  receipt, or Armed until resolved.
                enum:
                - Idle
                - Armed
                type: string
              lastBlockHash:
                description: LastBlockHash is the latest acknowledged block; it is
                  not a canonical-chain assertion.
                type: string
              lastCompletedAt:
                description: LastCompletedAt anchors cadence across ordinary controller
                  restarts.
                format: date-time
                type: string
              lastSkipReason:
                description: LastSkipReason reports the most recent bounded skip classification.
                enum:
                - Unavailable
                - Reserved
                - Outstanding
                - Expired
                - PolicyChanged
                - Capacity
                - Unobserved
                type: string
              message:
                description: Message explains the current operational state without
                  credential material.
                type: string
              observedGeneration:
                description: ObservedGeneration identifies the policy reflected by
                  Phase.
                format: int64
                type: integer
              opportunitiesConsumed:
                description: OpportunitiesConsumed is the latest observed target opportunity
                  number, including skips.
                format: int64
                minimum: 0
                type: integer
              opportunitiesSkipped:
                description: OpportunitiesSkipped counts consumed opportunities that
                  authorized no baseline RPC.
                format: int64
                minimum: 0
                type: integer
              phase:
                description: Phase is Waiting, Reserved, Collecting, Accounting, Running,
                  Paused, Blocked, or Abandoned.
                type: string
              podUID:
                description: PodUID records the admitted Pod incarnation.
                type: string
              reorganization:
                description: Reorganization retains the finite replacement and its
                  cleanup obligation.
                properties:
                  admittedAt:
                    description: AdmittedAt records first reservation time.
                    format: date-time
                    type: string
                  blocksGenerated:
                    description: BlocksGenerated counts acknowledged receipts, separately
                      from baseline blocks.
                    format: int32
                    type: integer
                  cleanupAcknowledged:
                    description: CleanupAcknowledged means compensation returned successfully.
                    type: boolean
                  cleanupUnsafe:
                    description: CleanupUnsafe prevents compensation on a changed
                      or expired execution boundary.
                    type: boolean
                  correlationID:
                    description: CorrelationID snapshots the external correlation
                      label.
                    type: string
                  effectUncertain:
                    description: EffectUncertain marks lost receipt/process knowledge;
                      time cannot clear it.
                    type: boolean
                  expiresAt:
                    description: ExpiresAt is the action's creation-relative deadline.
                    format: date-time
                    type: string
                  finalChain:
                    description: FinalChain records a successful local canonical/work
                      observation.
                    properties:
                      chainwork:
                        description: Chainwork is the fixed-width hexadecimal cumulative
                          work.
                        type: string
                      hash:
                        description: Hash identifies the block.
                        type: string
                      height:
                        description: Height records its chain position.
                        format: int64
                        type: integer
                      previousBlockHash:
                        description: PreviousBlockHash identifies its parent; genesis
                          has none.
                        type: string
                    required:
                    - chainwork
                    - hash
                    - height
                    type: object
                  forkParent:
                    description: ForkParent fixes the retained ancestor.
                    properties:
                      chainwork:
                        description: Chainwork is the fixed-width hexadecimal cumulative
                          work.
                        type: string
                      hash:
                        description: Hash identifies the block.
                        type: string
                      height:
                        description: Height records its chain position.
                        format: int64
                        type: integer
                      previousBlockHash:
                        description: PreviousBlockHash identifies its parent; genesis
                          has none.
                        type: string
                    required:
                    - chainwork
                    - hash
                    - height
                    type: object
                  generation:
                    description: Generation records admission metadata; deletion may
                      advance it without changing the immutable spec.
                    format: int64
                    type: integer
                  invalidatedHash:
                    description: InvalidatedHash fixes the sole compensation target.
                    type: string
                  invalidationAcknowledged:
                    description: InvalidationAcknowledged means the first mutation
                      returned successfully.
                    type: boolean
                  lastBlockHash:
                    description: LastBlockHash retains the latest action receipt.
                    type: string
                  lastCompletedAt:
                    description: LastCompletedAt anchors the action's next dispatch.
                    format: date-time
                    type: string
                  lastDispatchID:
                    description: LastDispatchID identifies the receipt to acknowledge
                      in action status.
                    type: string
                  name:
                    description: Name identifies the selected action object.
                    type: string
                  network:
                    description: Network captures admission against the current parent
                      catalog.
                    properties:
                      name:
                        description: Name identifies the admitted parent.
                        type: string
                      observedGeneration:
                        description: ObservedGeneration records the declaration generation
                          at admission.
                        format: int64
                        type: integer
                      uid:
                        description: UID fixes its incarnation.
                        type: string
                    required:
                    - name
                    - observedGeneration
                    - uid
                    type: object
                  originalChain:
                    description: OriginalChain fixes the original active tip.
                    properties:
                      chainwork:
                        description: Chainwork is the fixed-width hexadecimal cumulative
                          work.
                        type: string
                      hash:
                        description: Hash identifies the block.
                        type: string
                      height:
                        description: Height records its chain position.
                        format: int64
                        type: integer
                      previousBlockHash:
                        description: PreviousBlockHash identifies its parent; genesis
                          has none.
                        type: string
                    required:
                    - chainwork
                    - hash
                    - height
                    type: object
                  policy:
                    description: Policy records the ledger and static configuration
                      profile.
                    properties:
                      digest:
                        description: Digest identifies approved RPC configuration.
                        type: string
                      generation:
                        description: Generation records its policy generation at admission.
                        format: int64
                        type: integer
                      uid:
                        description: UID identifies the execution ledger.
                        type: string
                    required:
                    - digest
                    - generation
                    - uid
                    type: object
                  replacementBlockHashes:
                    description: ReplacementBlockHashes retains at most depth+1 exact
                      receipt hashes.
                    items:
                      type: string
                    maxItems: 7
                    type: array
                  spec:
                    description: Spec snapshots the immutable replacement operation.
                    properties:
                      address:
                        description: Address receives replacement coinbase outputs.
                        maxLength: 128
                        minLength: 14
                        type: string
                      bitcoinNodeRef:
                        description: BitcoinNodeRef names its exact compiled baseline
                          target.
                        properties:
                          name:
                            description: Name is the exact Kubernetes resource name.
                            maxLength: 63
                            pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      boundaryPolicy:
                        description: BoundaryPolicy explicitly accepts unknown protocol
                          schedule boundaries.
                        properties:
                          allowEpochBoundaryCrossing:
                            description: AllowEpochBoundaryCrossing permits an epoch
                              boundary in the affected range.
                            type: boolean
                            x-kubernetes-validations:
                            - message: unknown schedule requires explicit epoch opt-in
                              rule: self == true
                          allowPreparePhaseBoundaryCrossing:
                            description: AllowPreparePhaseBoundaryCrossing permits
                              a PoX prepare-phase boundary.
                            type: boolean
                            x-kubernetes-validations:
                            - message: unknown schedule requires explicit prepare-phase
                                opt-in
                              rule: self == true
                          allowRewardCycleBoundaryCrossing:
                            description: AllowRewardCycleBoundaryCrossing permits
                              a reward-cycle boundary.
                            type: boolean
                            x-kubernetes-validations:
                            - message: unknown schedule requires explicit reward-cycle
                                opt-in
                              rule: self == true
                        required:
                        - allowEpochBoundaryCrossing
                        - allowPreparePhaseBoundaryCrossing
                        - allowRewardCycleBoundaryCrossing
                        type: object
                      depth:
                        description: Depth is the suffix length; exactly depth+1 replacement
                          blocks are requested.
                        format: int32
                        maximum: 6
                        minimum: 1
                        type: integer
                      networkRef:
                        description: NetworkRef names the owning aggregate.
                        properties:
                          name:
                            description: Name is the exact Kubernetes resource name.
                            maxLength: 63
                            pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                            type: string
                        required:
                        - name
                        type: object
                      timeout:
                        description: Timeout bounds new invalidation and generation
                          from object creation.
                        maxLength: 32
                        type: string
                        x-kubernetes-validations:
                        - message: timeout must be positive
                          rule: duration(self) > duration('0s')
                        - message: timeout cannot exceed 10m
                          rule: duration(self) <= duration('10m')
                    required:
                    - address
                    - bitcoinNodeRef
                    - boundaryPolicy
                    - depth
                    - networkRef
                    - timeout
                    type: object
                    x-kubernetes-validations:
                    - message: action spec is immutable
                      rule: self == oldSelf
                  startedAt:
                    description: StartedAt records the first durable authorization.
                    format: date-time
                    type: string
                  step:
                    description: Step identifies the current or most recently acknowledged
                      typed mutation.
                    enum:
                    - Invalidate
                    - Generate
                    - Reconsider
                    type: string
                  stopReason:
                    description: StopReason freezes a definite admission/identity
                      failure before another dispatch.
                    type: string
                  target:
                    description: Target freezes the actor/runtime identity for all
                      dispatches.
                    properties:
                      apiVersion:
                        description: APIVersion fixes the actor API.
                        type: string
                      configDigest:
                        description: ConfigDigest binds approved configuration bytes.
                        type: string
                      containerID:
                        description: ContainerID records the admitted process container.
                        type: string
                      kind:
                        description: Kind fixes the actor type.
                        type: string
                      name:
                        description: Name identifies the compiled leaf.
                        type: string
                      podUID:
                        description: PodUID identifies the admitted Pod.
                        type: string
                      revision:
                        description: Revision identifies the admitted workload rollout.
                        type: string
                      runtimeImageID:
                        description: RuntimeImageID identifies the executed image.
                        type: string
                      specDigest:
                        description: SpecDigest binds actor configuration intent.
                        type: string
                      statefulSetUID:
                        description: StatefulSetUID identifies the owning workload
                          incarnation.
                        type: string
                      uid:
                        description: UID fixes the leaf incarnation.
                        type: string
                    required:
                    - apiVersion
                    - configDigest
                    - containerID
                    - kind
                    - name
                    - podUID
                    - revision
                    - runtimeImageID
                    - specDigest
                    - statefulSetUID
                    - uid
                    type: object
                  uid:
                    description: UID prevents action replacement from inheriting authority.
                    type: string
                  verifiedBlocks:
                    description: VerifiedBlocks counts receipts whose header ancestry
                      has been checked.
                    format: int32
                    type: integer
                  verifiedTip:
                    description: VerifiedTip anchors the next single-block request.
                    properties:
                      chainwork:
                        description: Chainwork is the fixed-width hexadecimal cumulative
                          work.
                        type: string
                      hash:
                        description: Hash identifies the block.
                        type: string
                      height:
                        description: Height records its chain position.
                        format: int64
                        type: integer
                      previousBlockHash:
                        description: PreviousBlockHash identifies its parent; genesis
                          has none.
                        type: string
                    required:
                    - chainwork
                    - hash
                    - height
                    type: object
                required:
                - admittedAt
                - expiresAt
                - forkParent
                - generation
                - invalidatedHash
                - name
                - network
                - originalChain
                - policy
                - spec
                - target
                - uid
                type: object
              targetUID:
                description: TargetUID records the admitted leaf incarnation.
                type: string
            type: object
            x-kubernetes-validations:
            - message: only one action may reserve the executor
              rule: '!(has(self.action) && has(self.reorganization))'
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
