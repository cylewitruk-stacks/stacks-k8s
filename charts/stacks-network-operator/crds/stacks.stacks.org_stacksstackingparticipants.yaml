                      - authorizedAt
                      - consumerUID
                      - containerID
                      - nonce
                      - operationDigest
                      - ordinal
                      - podUID
                      - targetUID
                      - txID
                      type: object
                  required:
                  - account
                  - transaction
                  type: object
                maxItems: 2
                type: array
                x-kubernetes-list-map-keys:
                - account
                x-kubernetes-list-type: map
              unlockHeight:
                description: UnlockHeight is the holder's observed current lock horizon.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
