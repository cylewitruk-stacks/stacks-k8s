---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: stacksstackingparticipants.stacks.stacks.org
spec:
  group: stacks.stacks.org
  names:
    kind: StacksStackingParticipant
    listKind: StacksStackingParticipantList
    plural: stacksstackingparticipants
    singular: stacksstackingparticipant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: StacksStackingParticipant maintains direct enrollment and renewal
          across supported protocols.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec declares the participant's maintained policy.
            properties:
              networkName:
                description: NetworkName identifies the owning network.
                maxLength: 63
                minLength: 1
                type: string
              networkUID:
                description: NetworkUID prevents admission after environment replacement.
                maxLength: 64
                minLength: 1
                type: string
              policy:
                description: Policy defines the maintained direct participant.
                properties:
                  administratorAccount:
                    description: AdministratorAccount names the manager's exclusive
                      deployment/registration account.
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                  amountMicroSTX:
                    description: |-
                      AmountMicroSTX applies to new enrollments; it does not resize an existing lock.
                      PoX-4 enrollment also satisfies the observed dynamic threshold.
                    format: int64
                    maximum: 9007199254740991
                    minimum: 50000000000
                    type: integer
                  consensusKeySecretRef:
                    description: ConsensusKeySecretRef supplies offline PoX authorizations
                      separately from holder spending.
                    properties:
                      digest:
                        description: Digest binds the exact bytes read before use.
                        maxLength: 71
                        pattern: ^sha256:[0-9a-f]{64}$
                        type: string
                      key:
                        description: Key identifies the entry within the object.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-zA-Z0-9._-]+$
                        type: string
                      name:
                        description: Name identifies the object containing the entry.
                        maxLength: 63
                        pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                        type: string
                    required:
                    - digest
                    - key
                    - name
                    type: object
                  holderAccount:
                    description: HolderAccount names the managed funded holder.
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                  lockCycles:
                    description: LockCycles is the enrollment horizon; renewal maintains
                      this horizon in bounded extensions.
                    format: int32
                    maximum: 12
                    minimum: 2
                    type: integer
                  name:
                    description: Name is the participant name within the network.
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                  paused:
                    description: Paused stops new enrollment and renewal, without
                      unlocking an existing stake.
                    type: boolean
                  signer:
                    description: Signer names the consensus signer actor independently
                      of its holder.
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                required:
                - administratorAccount
                - amountMicroSTX
                - consensusKeySecretRef
                - holderAccount
                - lockCycles
                - name
                - signer
                type: object
                x-kubernetes-validations:
                - message: holder and administrator accounts must be distinct
                  rule: self.holderAccount != self.administratorAccount
            required:
            - networkName
            - networkUID
            - policy
            type: object
            x-kubernetes-validations:
            - message: participant identities are immutable
              rule: self.networkName == oldSelf.networkName && self.networkUID ==
                oldSelf.networkUID && self.policy.name == oldSelf.policy.name && self.policy.signer
                == oldSelf.policy.signer && self.policy.holderAccount == oldSelf.policy.holderAccount
                && self.policy.administratorAccount == oldSelf.policy.administratorAccount
                && self.policy.consensusKeySecretRef == oldSelf.policy.consensusKeySecretRef
          status:
            description: Status records current observations and receipt acknowledgements.
            properties:
              burnHeight:
                description: BurnHeight is the chain observation used for this status.
                format: int64
                type: integer
              conditions:
                description: Conditions includes WorkerReady, independently of protocol
                  execution evidence.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                description: Message describes unmet prerequisites without raw RPC
                  data or credentials.
                maxLength: 1024
                type: string
              observedGeneration:
                description: ObservedGeneration identifies the declaration last inspected.
                format: int64
                type: integer
              phase:
                description: Phase describes current convergence without implying
                  permanent chain finality.
                enum:
                - Waiting
                - Paused
                - Pending
                - Ready
                - Blocked
                type: string
              protocol:
                description: Protocol is the observed active PoX contract, when relevant.
                type: string
              receipts:
                description: Receipts retains the latest acknowledgement for each
                  exclusively used account.
                items:
                  description: OperationAcknowledgement retains an account receipt
                    before permitting the account's next operation.
                  properties:
                    account:
                      description: Account identifies the ledger that owns this receipt.
                      type: string
                    transaction:
                      description: Transaction contains public authorization and exact
                        execution evidence.
                      properties:
                        accepted:
                          description: Accepted records an exact submission acknowledgement,
                            not execution.
                          type: boolean
                        acknowledged:
                          description: Acknowledged permits a newer ordinal after
                            the consumer retains the receipt.
                          type: boolean
                        authorizedAt:
                          description: AuthorizedAt is the authorization time, including
                            possibly-unsent requests.
                          format: date-time
                          type: string
                        consumerUID:
                          description: ConsumerUID binds the request to the observed
                            capability incarnation.
                          maxLength: 64
                          minLength: 1
                          type: string
                        containerID:
                          description: ContainerID identifies the admitted process
                            container.
                          type: string
                        nonce:
                          description: Nonce is the exclusively reserved canonical
                            account nonce.
                          format: int64
                          maximum: 9007199254740990
                          minimum: 0
                          type: integer
                        operationDigest:
                          description: OperationDigest binds the consumer's explicit
                            public intent.
                          maxLength: 71
                          pattern: ^sha256:[0-9a-f]{64}$
                          type: string
                        ordinal:
                          description: Ordinal is monotonic within this consumer's
                            account; old operations cannot replay.
                          format: int64
                          maximum: 9007199254740991
                          minimum: 1
                          type: integer
                        podUID:
                          description: PodUID identifies the admitted Pod.
                          type: string
                        receipt:
                          description: Receipt records observed canonical execution,
                            including unsuccessful execution.
                          properties:
                            blockID:
                              description: BlockID is the observed canonical index
                                block hash.
                              pattern: ^[0-9a-f]{64}$
                              type: string
                            observedAt:
                              description: ObservedAt records receipt collection time.
                              format: date-time
                              type: string
                            source:
                              description: Source identifies the qualified native
                                evidence path.
                              enum:
                              - NativeIndex
                              - LegacyEvent
                              type: string
                            success:
                              description: Success reports the transaction's response
                                result.
                              type: boolean
                          required:
                          - blockID
                          - observedAt
                          - success
                          type: object
                        rejectionReason:
                          description: RejectionReason is a bounded matched native
                            rejection; it does not free the nonce.
                          enum:
                          - FeeTooLow
                          - BadNonce
                          - Other
                          type: string
                        targetUID:
                          description: TargetUID identifies the admitted StacksNode.
                          type: string
                        txID:
                          description: TxID hashes the signed bytes before their sole
                            submission attempt.
                          pattern: ^[0-9a-f]{64}$
                          type: string
