---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: stackscontractsets.stacks.stacks.org
spec:
  group: stacks.stacks.org
  names:
    kind: StacksContractSet
    listKind: StacksContractSetList
    plural: stackscontractsets
    singular: stackscontractset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: StacksContractSet reconciles declared contract sources and initial
          registry state.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec binds contract intent to an owning environment.
            properties:
              networkName:
                description: NetworkName identifies the owning network.
                maxLength: 63
                minLength: 1
                type: string
              networkUID:
                description: NetworkUID prevents admission after environment replacement.
                maxLength: 64
                minLength: 1
                type: string
              policy:
                description: Policy declares the desired contract set.
                properties:
                  account:
                    description: Account names the exclusively assigned managed deployer
                      account.
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                  bridge:
                    description: Bridge initializes the standard sBTC registry after
                      its declared contracts exist.
                    properties:
                      aggregatePublicKey:
                        description: AggregatePublicKey is an explicit test key, not
                          a DKG result.
                        maxLength: 66
                        pattern: ^(02|03)[0-9a-f]{64}$
                        type: string
                      signerPublicKeys:
                        description: SignerPublicKeys are the retained bridge keys,
                          independent of consensus signers.
                        items:
                          maxLength: 66
                          pattern: ^(02|03)[0-9a-f]{64}$
                          type: string
                        maxItems: 2
                        minItems: 2
                        type: array
                        x-kubernetes-list-type: set
                    required:
                    - aggregatePublicKey
                    - signerPublicKeys
                    type: object
                  contracts:
                    description: Contracts are immutable named artifacts, not an imperative
                      transaction plan.
                    items:
                      description: ContractArtifact declares one immutable contract
                        and its dependency names.
                      properties:
                        clarityVersion:
                          description: ClarityVersion determines the earliest supported
                            language runtime.
                          enum:
                          - 3
                          - 6
                          format: int32
                          type: integer
                        dependsOn:
                          description: DependsOn names contracts in this set that
                            must be observed first.
                          items:
                            maxLength: 40
                            type: string
                          maxItems: 16
                          type: array
                          x-kubernetes-list-type: set
                        name:
                          description: Name is the contract name under the set's deployer
                            principal.
                          maxLength: 40
                          pattern: ^[a-zA-Z][a-zA-Z0-9_-]{0,39}$
                          type: string
                        sourceRef:
                          description: SourceRef selects exact source bytes from a
                            same-namespace ConfigMap.
                          properties:
                            digest:
                              description: Digest binds the exact bytes read before
                                use.
                              maxLength: 71
                              pattern: ^sha256:[0-9a-f]{64}$
                              type: string
                            key:
                              description: Key identifies the entry within the object.
                              maxLength: 253
                              minLength: 1
                              pattern: ^[a-zA-Z0-9._-]+$
                              type: string
                            name:
                              description: Name identifies the object containing the
                                entry.
                              maxLength: 63
                              pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                              type: string
                          required:
                          - digest
                          - key
                          - name
                          type: object
                      required:
                      - clarityVersion
                      - name
                      - sourceRef
                      type: object
                    maxItems: 16
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  name:
                    description: Name is the capability name within the network.
                    maxLength: 63
                    pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                  paused:
                    description: Paused prevents new authorizations; existing receipts
                      remain observable.
                    type: boolean
                required:
                - account
                - contracts
                - name
                type: object
                x-kubernetes-validations:
                - message: contract dependencies must name another contract in the
                    set
                  rule: self.contracts.all(c, !has(c.dependsOn) || c.dependsOn.all(d,
                    d != c.name && self.contracts.exists(other, other.name == d)))
                - message: bridge initialization requires the complete standard contract
                    set
                  rule: '!has(self.bridge) || [''sbtc-registry'', ''sbtc-token'',
                    ''sbtc-bootstrap-signers'', ''sbtc-deposit'', ''sbtc-withdrawal''].all(n,
                    self.contracts.exists(c, c.name == n))'
            required:
            - networkName
            - networkUID
            - policy
            type: object
            x-kubernetes-validations:
            - message: contract set identity and artifacts are immutable
              rule: self.networkName == oldSelf.networkName && self.networkUID ==
                oldSelf.networkUID && self.policy.name == oldSelf.policy.name && self.policy.account
                == oldSelf.policy.account && self.policy.contracts == oldSelf.policy.contracts
            - message: initial bridge identity is immutable
              rule: has(self.policy.bridge) == has(oldSelf.policy.bridge) && (!has(self.policy.bridge)
                || self.policy.bridge == oldSelf.policy.bridge)
          status:
            description: Status records observed contracts and exact transaction receipts.
            properties:
              burnHeight:
                description: BurnHeight is the chain observation used for this status.
                format: int64
                type: integer
              conditions:
                description: Conditions includes WorkerReady, independently of protocol
                  execution evidence.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                description: Message describes unmet prerequisites without raw RPC
                  data or credentials.
                maxLength: 1024
                type: string
              observedGeneration:
                description: ObservedGeneration identifies the declaration last inspected.
                format: int64
                type: integer
              phase:
                description: Phase describes current convergence without implying
                  permanent chain finality.
                enum:
                - Waiting
                - Paused
                - Pending
                - Ready
                - Blocked
                type: string
              protocol:
                description: Protocol is the observed active PoX contract, when relevant.
                type: string
              receipts:
                description: Receipts retains the latest acknowledgement for each
                  exclusively used account.
                items:
                  description: OperationAcknowledgement retains an account receipt
                    before permitting the account's next operation.
                  properties:
                    account:
                      description: Account identifies the ledger that owns this receipt.
                      type: string
                    transaction:
                      description: Transaction contains public authorization and exact
                        execution evidence.
                      properties:
                        accepted:
                          description: Accepted records an exact submission acknowledgement,
                            not execution.
                          type: boolean
                        acknowledged:
                          description: Acknowledged permits a newer ordinal after
                            the consumer retains the receipt.
                          type: boolean
                        authorizedAt:
                          description: AuthorizedAt is the authorization time, including
                            possibly-unsent requests.
                          format: date-time
                          type: string
                        consumerUID:
                          description: ConsumerUID binds the request to the observed
                            capability incarnation.
                          maxLength: 64
                          minLength: 1
                          type: string
                        containerID:
                          description: ContainerID identifies the admitted process
                            container.
                          type: string
                        nonce:
                          description: Nonce is the exclusively reserved canonical
                            account nonce.
                          format: int64
                          maximum: 9007199254740990
                          minimum: 0
                          type: integer
                        operationDigest:
                          description: OperationDigest binds the consumer's explicit
                            public intent.
                          maxLength: 71
                          pattern: ^sha256:[0-9a-f]{64}$
                          type: string
                        ordinal:
                          description: Ordinal is monotonic within this consumer's
                            account; old operations cannot replay.
                          format: int64
                          maximum: 9007199254740991
                          minimum: 1
                          type: integer
                        podUID:
                          description: PodUID identifies the admitted Pod.
                          type: string
                        receipt:
                          description: Receipt records observed canonical execution,
                            including unsuccessful execution.
                          properties:
                            blockID:
                              description: BlockID is the observed canonical index
                                block hash.
                              pattern: ^[0-9a-f]{64}$
                              type: string
                            observedAt:
                              description: ObservedAt records receipt collection time.
                              format: date-time
                              type: string
                            source:
                              description: Source identifies the qualified native
                                evidence path.
                              enum:
                              - NativeIndex
                              - LegacyEvent
                              type: string
                            success:
                              description: Success reports the transaction's response
                                result.
                              type: boolean
                          required:
                          - blockID
                          - observedAt
                          - success
                          type: object
                        rejectionReason:
                          description: RejectionReason is a bounded matched native
                            rejection; it does not free the nonce.
                          enum:
                          - FeeTooLow
                          - BadNonce
                          - Other
                          type: string
                        targetUID:
                          description: TargetUID identifies the admitted StacksNode.
                          type: string
                        txID:
                          description: TxID hashes the signed bytes before their sole
                            submission attempt.
                          pattern: ^[0-9a-f]{64}$
                          type: string
                      required:
                      - authorizedAt
                      - consumerUID
                      - containerID
                      - nonce
                      - operationDigest
                      - ordinal
                      - podUID
                      - targetUID
                      - txID
                      type: object
                  required:
                  - account
                  - transaction
                  type: object
                maxItems: 2
                type: array
                x-kubernetes-list-map-keys:
                - account
                x-kubernetes-list-type: map
              unlockHeight:
                description: UnlockHeight is the holder's observed current lock horizon.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
