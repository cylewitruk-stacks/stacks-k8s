---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: bitcoinblockproductions.bitcoin.stacks.org
spec:
  group: bitcoin.stacks.org
  names:
    kind: BitcoinBlockProduction
    listKind: BitcoinBlockProductionList
    plural: bitcoinblockproductions
    singular: bitcoinblockproduction
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.opportunities
      name: Opportunities
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BitcoinBlockProduction maintains one aggregate-owned weighted
          production policy.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is compiled from StacksNetwork.
            properties:
              networkName:
                description: NetworkName identifies the owning StacksNetwork.
                maxLength: 63
                minLength: 1
                type: string
              networkUID:
                description: NetworkUID prevents replacement networks from inheriting
                  authority.
                maxLength: 64
                minLength: 1
                type: string
              policy:
                description: Policy declares the total offered cadence and target
                  weights.
                properties:
                  credentialsSecret:
                    description: |-
                      CredentialsSecret names the same-namespace immutable worker credential document.
                      Bitcoin uses credentials.json; transfers use account.json.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  initialization:
                    description: Initialization prepares a watch-only miner wallet
                      and an initial regtest chain floor.
                    properties:
                      initialHeight:
                        description: InitialHeight is the initial regtest chain floor,
                          not an ongoing height target.
                        format: int64
                        maximum: 201
                        minimum: 1
                        type: integer
                      target:
                        description: Target names the production target whose wallet
                          funds the initial miner.
                        maxLength: 63
                        pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                        type: string
                      wallet:
                        description: Wallet names the watch-only descriptor wallet
                          used by Stacks miners.
                        maxLength: 63
                        pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                        type: string
                    required:
                    - initialHeight
                    - target
                    - wallet
                    type: object
                  intervalSeconds:
                    description: IntervalSeconds is the central policy interval, independently
                      of receipt time.
                    format: int32
                    maximum: 86400
                    minimum: 1
                    type: integer
                  jitterSeconds:
                    description: JitterSeconds samples integer delays uniformly in
                      intervalSeconds plus or minus this bound.
                    format: int32
                    maximum: 43199
                    minimum: 0
                    type: integer
                  paused:
                    description: Paused stops new opportunities; already authorized
                      work may still complete.
                    type: boolean
                  targets:
                    description: Targets names declared actors; weights distribute
                      the policy's total offered rate.
                    items:
                      description: ProductionTarget configures one weighted actor
                        and its coinbase destination.
                      properties:
                        address:
                          description: Address receives this target's generated coinbase
                            outputs.
                          maxLength: 128
                          minLength: 14
                          type: string
                        name:
                          description: Name identifies a Bitcoin actor declared in
                            the owning network.
                          maxLength: 63
                          pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                          type: string
                        weight:
                          description: Weight is a relative share of generation opportunities,
                            without availability redistribution.
                          format: int32
                          maximum: 1000
                          minimum: 1
                          type: integer
                      required:
                      - address
                      - name
                      - weight
                      type: object
                    maxItems: 8
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                required:
                - intervalSeconds
                - targets
                type: object
                x-kubernetes-validations:
                - message: jitter must keep intervals within 1 to 86400 seconds
                  rule: '!has(self.jitterSeconds) || (self.jitterSeconds < self.intervalSeconds
                    && self.intervalSeconds + self.jitterSeconds <= 86400)'
                - message: initial wallet preparation requires one matching production
                    target
                  rule: '!has(self.initialization) || (size(self.targets) == 1 &&
                    self.targets[0].name == self.initialization.target)'
            required:
            - networkName
            - networkUID
            - policy
            type: object
            x-kubernetes-validations:
            - message: network identity is immutable
              rule: self.networkName == oldSelf.networkName && self.networkUID ==
                oldSelf.networkUID
          status:
            description: Status pins target ledgers and records bounded scheduling
              facts.
            properties:
              lastUnassignedTarget:
                description: LastUnassignedTarget names the most recent selection
                  without a pinned ledger.
                maxLength: 63
                pattern: ^[a-z0-9](?:[-a-z0-9]{0,61}[a-z0-9])?$
                type: string
              message:
                description: Message reports scheduling/configuration state without
                  credentials.
                type: string
              nextOpportunityAt:
                description: NextOpportunityAt enforces cadence across reconciles
                  and restarts without catch-up.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration identifies the scheduling configuration.
                format: int64
                type: integer
              opportunities:
                description: Opportunities counts durably published weighted selections.
                format: int64
                minimum: 0
                type: integer
              phase:
                description: Phase summarizes scheduler availability, not network
                  health or receipts.
                enum:
                - Running
                - Paused
                - Waiting
                - Blocked
                - Abandoned
                type: string
              targets:
                description: Targets retains up to sixteen identities for the policy
                  lifetime, including removed targets.
                items:
                  description: TargetLedger permanently pins one target's execution
                    resource and latest opportunity.
                  properties:
                    name:
                      description: Name is the logical actor name.
                      type: string
                    offered:
                      description: Offered counts selections of this target, including
                        unavailable or reserved opportunities.
                      format: int64
                      type: integer
                    opportunity:
                      description: Opportunity retains the latest selection for this
                        target; earlier unseen selections are skipped.
                      properties:
                        expiresAt:
                          description: ExpiresAt bounds admission; it does not cancel
                            an already armed server operation.
                          format: date-time
                          type: string
                        number:
                          description: Number is the target's monotonically increasing
                            offered count.
                          format: int64
                          type: integer
                        policyGeneration:
                          description: PolicyGeneration binds the selected policy
                            configuration.
                          format: int64
                          type: integer
                      required:
                      - expiresAt
                      - number
                      - policyGeneration
                      type: object
                    resourceName:
                      description: ResourceName identifies the internal BitcoinProductionTarget.
                      type: string
                    uid:
                      description: UID pins the ledger even after target removal or
                        resource loss.
                      type: string
                  required:
                  - name
                  - resourceName
                  - uid
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              unassignedOpportunities:
                description: UnassignedOpportunities counts selections skipped before
                  a target ledger could be pinned.
                format: int64
                minimum: 0
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
