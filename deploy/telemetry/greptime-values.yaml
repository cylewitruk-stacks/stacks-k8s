# Upstream greptimedb-standalone chart 0.4.14; optional standalone local backend.
fullnameOverride: greptime
image:
  tag: v1.2.0
persistence:
  size: 10Gi
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: '2'
    memory: 2Gi
nodeSelector:
  kubernetes.io/hostname: stacks-k8s-control-plane
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
logging:
  onlyLogToStdout: true
auth:
  enabled: true
  existingSecretName: greptime-auth
configToml: |
  mode = 'standalone'
  max_in_flight_write_bytes = '32MB'
  max_concurrent_queries = 4
  [query]
  parallelism = 2
  memory_pool_size = '128MB'
  [[region_engine]]
  [region_engine.mito]
  num_workers = 2
  global_write_buffer_size = '128MB'
  global_write_buffer_reject_size = '256MB'
  sst_meta_cache_size = '32MB'
  vector_cache_size = '32MB'
  page_cache_size = '32MB'
  selector_result_cache_size = '16MB'
  range_result_cache_size = '16MB'
  prefilter_result_cache_size = '16MB'
  manifest_cache_size = '32MB'
  scan_memory_limit = '128MB'
