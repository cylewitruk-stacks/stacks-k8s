name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Go lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: operators/network/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          install-only: true
      - run: make -k lint fmt-check

  chart-policy:
    name: Chart policy and native admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/chart-policy/go.mod
          cache-dependency-path: tools/chart-policy/go.sum
      - uses: azure/setup-helm@v5
      - run: make verify-chart-policy
      - run: make -C charts/stacks-chaos-profile verify

  network:
    name: Network operator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: operators/network/go.mod
          cache-dependency-path: |
            libs/stacks/go.sum
            apis/network/go.sum
            apis/network/tools/go.sum
            operators/network/go.sum
            operators/action/go.sum
      - uses: azure/setup-helm@v5
      - run: make verify-network
      - run: make api-verify verify-library

  action:
    name: Action operator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: operators/action/go.mod
          cache-dependency-path: |
            libs/stacks/go.sum
            apis/network/go.sum
            operators/action/go.sum
      - uses: azure/setup-helm@v5
      - run: make verify-action

  observability:
    name: Observability operator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: operators/observability/go.mod
          cache-dependency-path: |
            operators/observability/go.sum
            operators/observability/tools/go.sum
      - uses: azure/setup-helm@v5
      - run: make verify-observability

  modules:
    name: Module integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: operators/network/go.mod
          cache-dependency-path: |
            libs/stacks/go.sum
            apis/network/go.sum
            apis/network/tools/go.sum
            operators/network/go.sum
            operators/action/go.sum
            operators/observability/go.sum
            operators/observability/tools/go.sum
            tools/chart-policy/go.sum
            tools/module-policy/go.sum
      - run: make modules-verify
      - run: make module-policy-verify
      - run: make verify-local-cluster

  containers:
    name: Container builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: make docker-check
      - run: make docker-build
