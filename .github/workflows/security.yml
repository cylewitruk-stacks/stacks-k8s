name: Security

on:
  pull_request:
    paths:
      - .github/workflows/security.yml
      - Makefile
      - libs/**
      - apis/**
      - operators/**
      - tools/**
      - charts/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/security.yml
      - Makefile
      - libs/**
      - apis/**
      - operators/**
      - tools/**
      - charts/**
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: operators/network/go.mod
          cache-dependency-path: |
            libs/stacks/go.sum
            apis/network/go.sum
            operators/network/go.sum
            operators/observability/go.sum
            operators/action/go.sum
            tools/chart-policy/go.sum
      - run: make vuln
